apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

/**
 * Release optimization
 */
def enableProguardInReleaseBuilds = false

/**
 * JSC fallback
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {

    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.moto_vendor"

    defaultConfig {

        applicationId "com.moto_vendor"

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 1
        versionName "1.0"

        multiDexEnabled true
    }

    /**
     * Signing configs
     */
    signingConfigs {

        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    /**
     * Build types
     */
    buildTypes {

        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }

        release {

            // TEMPORARY
            // Replace with release keystore for Play Store
            signingConfig signingConfigs.debug

            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources false

            proguardFiles getDefaultProguardFile(
                    "proguard-android-optimize.txt"
            ),
                    "proguard-rules.pro"
        }
    }

    /**
     * ABI SPLITS
     * Creates separate APKs for each CPU architecture
     *
     * Debug -> disabled
     * Release -> enabled
     */
    // splits {

    //     abi {

    //         reset()

    //         enable !gradle.startParameter.taskNames.any {
    //             it.toLowerCase().contains("debug")
    //         }

    //         universalApk true

    //         include"arm64-v8a",
    //                 "x86",
                   
    //     }
    // }
splits {

    abi {

        reset()

        enable !gradle.startParameter.taskNames.any {
            it.toLowerCase().contains("debug")
        }

        universalApk false

        include "arm64-v8a", "x86_64"
    }
}
    /**
     * Packaging fixes
     */
    packagingOptions {

        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
    }
}

dependencies {

    /**
     * React Native Android
     */
    implementation("com.facebook.react:react-android")

    /**
     * Multidex
     */
    implementation 'androidx.multidex:multidex:2.0.1'

    /**
     * Native modules stability
     */
    implementation("androidx.core:core-ktx:1.12.0")

    /**
     * Hermes / JSC
     */
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

/**
 * Vector Icons
 */
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"